<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
</head><body style="margin:0">
<title>EKUZO Roadshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-width stack of snap-scrolling "slides", each ~90% of the screen so the next one peeks.
   Committed single look (colour blocks), so every colour is set explicitly rather than following the viewer theme. */
:root{
  --red:#F92524; --ink:#111013; --ink-2:#1C1A1F; --bone:#EFEEED; --paper:#F7F6F4; --violet:#8E22E0; --white:#FFFFFF;
  --display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --col:min(100vw,460px);
  --slide-h:90svh;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
html{scroll-snap-type:y mandatory;background:#0A090B}
body{margin:0;background:#0A090B;color:var(--white);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

.deck{width:var(--col);margin:0 auto;position:relative;background:var(--ink)}
/* Phone frame on laptops and desktops: the page plays inside a fixed phone-sized screen, like a Figma prototype share */
.device,.scroller{display:contents}
@media (min-width:700px) and (min-height:560px) and (hover:hover){
  html{scroll-snap-type:none;overflow:hidden;height:100%;background:#1C1C1E}
  body{height:100%;background:#1C1C1E;overflow:hidden}
  :root{--phone-h:844px;--phone-w:390px;--col:390px;--slide-h:760px}
  .device{display:block;position:fixed;left:50%;top:50%;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--ink);
    transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;
    box-shadow:0 0 0 11px #0A0A0B,0 0 0 12px #3A3A3C,0 40px 90px rgba(0,0,0,.55)}
  .scroller{display:block;height:100%;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .deck{width:100%}
  .slide{min-height:0}
  .slide:last-child{height:var(--phone-h)}
  .hud,.menu-in{width:100%}
  .float{width:calc(100% - 32px)}
  .editbar{width:calc(100% - 24px)}
}
@media (min-width:600px){
  .desk-note{position:fixed;left:24px;bottom:24px;max-width:220px;font:500 12px/1.5 var(--mono);color:#8d8892;letter-spacing:.04em}
}
@media (max-width:599px){.desk-note{display:none}}

/* HUD */
.hud{position:fixed;top:0;left:50%;transform:translateX(-50%);width:var(--col);z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;mix-blend-mode:normal}
.hud-row{display:flex;justify-content:space-between;align-items:center}
.mark{display:block;width:86px;color:var(--hud-fg,#fff);pointer-events:auto;line-height:0}
.mark svg{width:100%;height:auto;display:block}
.cover-logo{width:min(40%,150px);color:var(--white);line-height:0;margin-bottom:6px}
.cover-logo svg{width:100%;height:auto;display:block}
.foot-logo{width:64px;color:#8d8892;line-height:0}
.foot-logo svg{width:100%;height:auto;display:block}
.count{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hud-fg,#fff);font-variant-numeric:tabular-nums;opacity:.9}
.bar{display:flex;gap:3px;height:3px}
.bar i{flex:1;background:var(--hud-fg,#fff);opacity:.25;border-radius:2px;transition:opacity .25s}
.bar i.on{opacity:1}
.hud{transition:color .3s}
.hud .mark{transition:opacity .25s}
.hud.on-cover .mark{opacity:0;pointer-events:none}

/* Slides */
.slide{position:relative;height:var(--slide-h);min-height:560px;scroll-snap-align:start;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 88px;
  background:var(--bg);color:var(--fg)}
.slide:last-child{height:100svh}
.slide.grow{height:auto;min-height:var(--slide-h);padding-top:84px}
@media (max-height:720px){.slide{padding-bottom:64px}}
.slide.t-ink{--bg:var(--ink);--fg:var(--white);--sub:#CFCBD3;--acc:var(--red);--chip:#2A272E}
.slide.t-red{--bg:var(--red);--fg:var(--white);--sub:#FFE9E8;--acc:var(--ink);--chip:#D41615}
.slide.t-bone{--bg:var(--bone);--fg:var(--ink);--sub:#3D3A40;--acc:var(--red);--chip:#E0DEDC}
.slide.t-violet{--bg:var(--violet);--fg:var(--white);--sub:#F1E4FF;--acc:#FFD3F0;--chip:#7618C2}
/* Section accents, from the EKUZO expanded palette: one accent per section */
.slide.t-lime{--bg:#E0FF4E;--fg:var(--ink);--sub:#2E3313;--acc:var(--ink);--chip:#CDEB33}
.slide.t-blue{--bg:#034FFF;--fg:var(--white);--sub:#DCE6FF;--acc:var(--ink);--chip:#0040D6}
.slide.t-cream{--bg:#F8F4E2;--fg:var(--ink);--sub:#3D3A40;--acc:#3791A6;--chip:#ECE6CC}
.slide.t-teal{--bg:#3791A6;--fg:var(--ink);--sub:#0E2A31;--acc:var(--white);--chip:#2E7E91}
.slide.t-yellow{--bg:#FDE74C;--fg:var(--ink);--sub:#3A3410;--acc:var(--ink);--chip:#F0D72E}
.slide.t-slate{--bg:#1C3745;--fg:var(--white);--sub:#CFE0E8;--acc:#60E1E0;--chip:#24485A}
.slide.t-arcade{--bg:#0B0A12;--fg:var(--white);--sub:#C9C5D6;--acc:#E0FF4E;--chip:#1E1B2E}
.slide.t-magenta{--bg:#FF2ECC;--fg:var(--ink);--sub:#3A0A2F;--acc:var(--ink);--chip:#F014BC}
.slide.t-green{--bg:#49B41A;--fg:var(--ink);--sub:#10260A;--acc:var(--white);--chip:#3FA015}

.photo{position:absolute;inset:0 0 auto 0;height:60%;margin:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to bottom,transparent,var(--bg))}
.photo::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent);z-index:1}

.copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
.kicker{font:700 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);opacity:.85;display:flex;gap:10px;align-items:center}
.kicker::before{content:"";width:18px;height:2px;background:var(--acc)}
.kicker:empty{display:none}
.head{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:.005em;
  margin:0;font-size:120px;text-wrap:balance;overflow-wrap:normal;word-break:keep-all;transform-origin:left bottom}
.head .dot{color:var(--acc)}
.sub{font:500 19px/1.38 var(--body);color:var(--sub);margin:0;max-width:30ch;text-wrap:pretty}
.slide.in .head{animation:rise .55s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(.18em)}to{transform:none}}

/* Cover */
.t-cover .head{font-size:150px}
.cue{position:absolute;left:16px;right:16px;bottom:calc(10svh - 34px);display:none}
.scroll-cue{margin-top:6px;font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);opacity:.7;display:flex;gap:8px;align-items:center}
.scroll-cue b{display:inline-block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
.cover-stripes{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-58deg,transparent 0 46px,rgba(249,37,36,.9) 46px 58px,transparent 58px 92px);
  -webkit-mask:linear-gradient(to bottom,#000 0 8%,transparent 30%);mask:linear-gradient(to bottom,#000 0 8%,transparent 30%);opacity:.95}

/* Season ladder */
.ladder{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.ladder li{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:12px;background:var(--chip);padding:10px 12px;border-radius:4px}
.ladder .when{font:700 10px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.ladder .what{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ladder li.peak{background:var(--red);color:#fff}
.ladder li.peak .when{color:#FFE2E1}

/* Lanes */
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:4px}
.lanes button{all:unset;cursor:pointer;background:var(--chip);border-radius:4px;padding:14px 12px;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.lanes button{background:var(--lc);color:var(--lf)}
.lanes button span{color:inherit!important;opacity:.7}
.skills{margin:2px 0 0;display:grid;gap:0;border-top:1.5px solid var(--fg)}
.skills div{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 25%,transparent)}
.skills dt{font:500 15px/1.3 var(--body);color:var(--sub);min-width:0}
.skills dd{margin:0;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--fg)}
.lanes button:last-child:nth-child(odd){grid-column:1/-1}
.coaches{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px}
.coaches li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--chip);border-radius:6px;padding:8px}
.coaches img{width:64px;height:64px;object-fit:cover;border-radius:4px;display:block}
.coaches div{display:flex;flex-direction:column;gap:3px;min-width:0}
.coaches strong{font:800 19px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.coaches span{font:700 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.coaches em{font:400 13px/1.3 var(--body);font-style:normal;color:var(--sub)}
.lanes button span{font:700 12px/1 var(--mono);color:var(--acc)}
.lanes button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Buttons & form */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:54px;padding:0 22px;border-radius:999px;font:700 16px/1 var(--body);background:var(--fg);color:var(--bg);align-self:flex-start}
.btn:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn.full{align-self:stretch}
.form{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.form .l{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.form input[type=email]{font:500 18px/1 var(--body);padding:16px;border-radius:6px;border:2px solid #3a3640;background:var(--ink-2);color:#fff;width:100%}
.form input[type=email]:focus{outline:none;border-color:var(--red)}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.roles label{cursor:pointer}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles span{display:inline-block;padding:9px 13px;border-radius:999px;border:1.5px solid #4a4550;font:600 14px/1 var(--body);color:#DDD9E0}
.roles input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.roles input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.form .err{font:500 14px/1.3 var(--body);color:#FF8C8B;min-height:1em;margin:0}
.done{display:flex;flex-direction:column;gap:8px}
.done strong{font:900 44px/.9 var(--display);text-transform:uppercase;color:var(--red)}
.foot{display:flex;justify-content:space-between;font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8d8892;margin-top:6px}
.preview-note{font:500 12px/1.4 var(--mono);color:#FFB86B;display:none}
body.editing .preview-note{display:block}

/* Floating CTA */
.float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:19;
  width:calc(var(--col) - 32px);display:flex;justify-content:flex-end;pointer-events:none;transition:opacity .25s, translate .25s}
.float .btn{pointer-events:auto;background:var(--red);color:#fff;min-height:44px;font-size:14px;padding:0 18px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.float.hide{opacity:0;translate:0 12px}
.float.hide .btn{pointer-events:none}

/* Choose your player */
.select{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:2px}
.select button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--rb);color:var(--rf);border-radius:4px;padding:9px 11px 10px;min-height:72px;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .12s}
.select .meta{display:flex;justify-content:space-between;font:700 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.select strong{font:800 26px/.9 var(--display);text-transform:uppercase;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.select strong.long{font-size:clamp(17px,calc(var(--col) * .052),22px);overflow-wrap:normal}
.select button:active{transform:scale(.97)}
.select button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px}
.select button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.everything{all:unset;cursor:pointer;align-self:flex-start;font:700 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#bdb8c2;padding:6px 0}
.everything:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* Question openers */
.opts{display:grid;grid-template-columns:1fr;gap:6px;margin-top:2px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.two button:last-child:nth-child(odd){grid-column:1/-1}
.opts button{all:unset;box-sizing:border-box;cursor:pointer;padding:14px;border-radius:4px;background:var(--chip);color:var(--fg);font:700 17px/1.2 var(--body);transition:transform .12s}
.opts button:active{transform:scale(.98)}
.opts button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.opts button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.reply-wrap{display:flex;flex-direction:column;gap:12px}
.reply-wrap:empty{display:none}
.reply{margin:0;font:600 20px/1.35 var(--body);color:var(--fg);max-width:30ch;animation:rise .35s cubic-bezier(.2,.7,.2,1)}
.reply-wrap .btn{min-height:46px;font-size:15px}
.switch{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:4px;background:#1f1d23;color:#fff;font:500 14px/1 var(--body)}
.switch span:last-child{font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#bdb8c2}
.switch:focus-visible{outline:2px solid #fff}
/* Struck list (the Shortlist mechanic) */
.slist{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.slist li{position:relative;align-self:flex-start;font:800 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;color:var(--fg)}
.slist li span{padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.slist li:not(.keep) span{background:linear-gradient(var(--red),var(--red)) no-repeat 0 56%/100% 5px}
.slist li:not(.keep){opacity:.55}
.slide.in .slist:not(.pick) li:not(.keep) span{animation:strike .35s cubic-bezier(.6,0,.3,1) both;animation-delay:var(--d)}
@keyframes strike{from{background-size:0% 5px}to{background-size:100% 5px}}
.slist .keep{margin-top:6px;opacity:1}
.slist .keep span{background:var(--acc);color:var(--bg);padding:2px 8px}
.slist li{max-width:100%}
.slide.t-ink .slist .keep span,.slide.t-arcade .slist .keep span{background:#E0FF4E;color:#111013}
.slide.in .slist:not(.pick) .keep{animation:keepin .4s ease both;animation-delay:calc(var(--d) + .1s)}
@keyframes keepin{from{transform:translateY(6px)}to{transform:none}}
.slist.pick li:not(.keep){opacity:1;cursor:pointer;border-radius:4px}
.slist.pick li:not(.keep) span{background-size:0% 5px;transition:background-size .25s cubic-bezier(.6,0,.3,1)}
.slist.pick li.x{opacity:.55}
.slist.pick li.x span{background-size:100% 5px}
.slist.pick li:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.slist.pick .keep{visibility:hidden}
.slist.pick.done .keep{visibility:visible;animation:keepin .4s ease both}
.slist-reply:empty{display:none}
@media (prefers-reduced-motion:reduce){.slist *{animation:none!important;transition:none!important}}
/* Mini games */
.game{background:var(--chip);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.game-hud{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.game-hud b{color:var(--acc);font-size:13px}
.game canvas{display:block;width:100%;height:auto;aspect-ratio:720/560;background:linear-gradient(180deg,#16142a,#0B0A12);touch-action:none;cursor:crosshair}
.game-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
.game-msg{margin:0;font:500 13px/1.35 var(--body);color:var(--sub);min-width:0}
.game-btn{min-height:40px;padding:0 16px;font-size:14px;background:var(--acc);color:#111013;flex:none}
.orbgame{display:flex;flex-direction:column;align-items:center;gap:12px}
.orb{all:unset;box-sizing:border-box;cursor:pointer;width:min(62vw,230px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;touch-action:none;
  background:conic-gradient(from 210deg,#F92524,#FF2ECC,#034FFF,#E0FF4E,#F92524);transition:transform .12s;animation:breathe 3.4s ease-in-out infinite}
.orb:focus-visible{outline:3px solid #fff;outline-offset:4px}
.orb:active{transform:scale(.97)}
.orb.live{animation:pulse3 3s linear infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes pulse3{0%{transform:scale(.94)}100%{transform:scale(1.12)}}
.orb-in{width:78%;height:78%;border-radius:50%;background:var(--bg);display:grid;place-content:center;gap:6px;text-align:center;padding:10px}
.orb-big{font:900 44px/1 var(--display);text-transform:uppercase;color:var(--fg)}
.orb-sm{font:700 9px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.orb-v{margin:0;min-height:2.6em;font:600 15px/1.35 var(--body);color:var(--fg);text-align:center;max-width:32ch}
/* Gate: sign up now, or keep learning */
.gform .l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gate-more{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:4px}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg);min-height:46px;font-size:15px}
.paths-toggle{all:unset;cursor:pointer;font:700 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sub);padding:6px 0}
.paths-toggle[aria-expanded="true"]{color:var(--fg)}
.paths-toggle:focus-visible,.paths button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.paths{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.paths::-webkit-scrollbar{display:none}
.paths[hidden]{display:none}
.paths button{all:unset;box-sizing:border-box;flex:none;white-space:nowrap;cursor:pointer;padding:10px 14px;border-radius:999px;background:var(--chip);color:var(--fg);font:600 14px/1.1 var(--body)}
.slide .done .sub{color:var(--sub)}
.gdone strong{color:var(--fg)}
/* Menu */
.hud-right{display:flex;align-items:center;gap:12px}
.menu-btn{all:unset;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 11px 7px 10px;border-radius:999px;
  background:var(--hud-fg,#fff);color:var(--hud-bg,#111013);font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;position:relative}
.menu-btn i{display:none}
.menu-btn::before{content:"";width:12px;height:8px;background:linear-gradient(currentColor 0 0) top/100% 2px no-repeat,linear-gradient(currentColor 0 0) center/100% 2px no-repeat,linear-gradient(currentColor 0 0) bottom/100% 2px no-repeat}
.menu-btn:focus-visible{outline:2px solid var(--hud-fg,#fff);outline-offset:3px}
.menu{position:fixed;inset:0;z-index:45;background:rgba(5,5,6,.6);display:flex;justify-content:center}
.menu-in{width:var(--col);height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:14px}
.menu:not([hidden]) .menu-in{animation:menuIn .28s cubic-bezier(.2,.7,.2,1)}
@keyframes menuIn{from{transform:translateY(-14px)}to{transform:none}}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-logo{width:86px;color:#fff;line-height:0}.menu-logo svg{width:100%;height:auto;display:block}
.menu-close{all:unset;cursor:pointer;font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1.5px solid #4a4550;color:#fff}
.menu-close:focus-visible{outline:2px solid #fff;outline-offset:2px}
.menu-kicker{margin:6px 0 0;font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#a8a3ad}
.menu-list{display:flex;flex-direction:column;gap:4px}
.menu-group{margin:10px 0 2px;font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7d7882}
.menu-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;
  padding:13px 14px;border-radius:4px;background:var(--rb);color:var(--rf)}
.menu-row.ring{box-shadow:inset 0 0 0 1.5px #3a3640}
.menu-row .n{font:700 11px/1 var(--mono);opacity:.65;font-variant-numeric:tabular-nums}
.menu-row .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.menu-row strong{font:800 26px/.95 var(--display);text-transform:uppercase;letter-spacing:.02em}
.menu-row small{font:500 13px/1.25 var(--body);opacity:.8}
.menu-row .c{font:700 10px/1 var(--mono);letter-spacing:.06em;opacity:.7;text-align:right;white-space:nowrap}
.menu-row .here{display:block;margin-top:4px;padding:3px 6px;border-radius:999px;background:var(--rf);color:var(--rb);font:700 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:1}
.menu-row:focus-visible{outline:2px solid #fff;outline-offset:2px}
.menu-foot{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.menu-edit{all:unset;cursor:pointer;align-self:center;font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8d8892;padding:8px}
.menu-edit:focus-visible{outline:2px solid #fff}
body.menu-open{overflow:hidden}
/* Edit mode */
.edit-toggle{all:unset;position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);right:max(16px,calc(50vw - 230px + 16px));z-index:30;
  cursor:pointer;font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:rgba(17,16,19,.55);color:#fff;backdrop-filter:blur(6px)}
.edit-toggle:focus-visible{outline:2px solid #fff}
body.editing .edit-toggle{background:#FFB86B;color:#111}
.tools{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 84px);left:16px;right:16px;z-index:5;gap:6px;flex-wrap:wrap}
body.editing .tools{display:flex}
.tools button{all:unset;cursor:pointer;font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 9px;border-radius:4px;background:rgba(17,16,19,.82);color:#fff}
.tools button:focus-visible{outline:2px solid #FFB86B}
body.editing [contenteditable]{outline:1px dashed rgba(255,184,107,.8);outline-offset:4px;border-radius:2px}
body.editing [contenteditable]:focus{outline-style:solid}
.editbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:31;width:calc(var(--col) - 24px);
  background:#FFB86B;color:#111;border-radius:10px;padding:8px;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
body.editing .editbar{display:flex}
body.editing .float{display:none}
.editbar button{all:unset;cursor:pointer;font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-radius:6px;background:#111;color:#FFB86B}
.editbar button:focus-visible{outline:2px solid #111;outline-offset:2px}
.editbar .msg{flex-basis:100%;text-align:center;font:500 11px/1.3 var(--mono);min-height:1em}
.export{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px}
.export.open{display:flex}
.export div{background:#fff;color:#111;border-radius:10px;padding:14px;width:min(100%,440px);display:flex;flex-direction:column;gap:10px}
.export textarea{width:100%;height:50vh;font:12px/1.45 var(--mono)}
.export button{all:unset;cursor:pointer;align-self:flex-end;font:700 12px/1 var(--mono);padding:10px 12px;background:#111;color:#fff;border-radius:6px}
</style>

// Which slides show, in what order: the select screen, then the chosen player's path (or everything).
function visible(){
  const sel = slides.findIndex(s=>s.type==="select");
  const head = sel >= 0 ? [sel] : [];
  if(role && ROLE[role].seq) return ROLE[role].seq.map(id=>slides.findIndex(s=>s.id===id)).filter(i=>i>=0);
  if(!role) return head.concat(slides.map((_,i)=>i).filter(i=>i!==sel && slides[i].sec!=="adflow"));
  const out = [...head];
  ROLE[role].path.forEach(k=>slides.forEach((s,i)=>{ if(s.sec===k && !(s.skip||[]).includes(role)) out.push(i); }));
  return out;
}

const deck = document.getElementById("deck");
// In the desktop phone frame the page scrolls inside #scroller; on a real phone it scrolls the window.
// Scale the 390x844 phone frame down to fit short laptop windows, like a Figma prototype share.
function fitDevice(){ document.documentElement.style.setProperty("--fit", Math.min(1, (innerHeight - 64) / 844, (innerWidth - 64) / 390).toFixed(4)); }
fitDevice(); addEventListener("resize", fitDevice);
const SCROLLER = () => { const s = document.getElementById("scroller"); return s && getComputedStyle(s).display === "block" ? s : null; };
function render(){
  const vis = visible();
  deck.innerHTML = vis.map(i=>{ const s = slides[i]; return `<section class="slide t-${s.tone}${s.type==='select'?' t-cover':''}"${s.tone==='ink' && SEC[s.sec]?.acc ? ` style="--acc:${SEC[s.sec].acc}"` : ''} id="s${i+1}" data-i="${i}" aria-label="${esc(s.head)}">${body(s,i)}</section>`; }).join("");

// Fit each headline to the column by measuring, never estimating.
function fit(h){
  const slide = h.closest(".slide");
  slide.classList.remove("grow");
  const max = h.closest(".t-cover") ? 140 : (h.textContent.length > 16 ? 96 : 120);
  const maxH = slide.clientHeight * (slide.querySelector(".photo") ? 0.30 : 0.42);
  const padB = parseFloat(getComputedStyle(slide).paddingBottom) || 0;
  const copy = h.closest(".copy"), room = slide.clientHeight - padB - (slide.querySelector(".photo") ? slide.clientHeight*0.38 : 72);
  let size = max; h.style.fontSize = size + "px";
  let guard = 0;
  while((h.scrollWidth > h.clientWidth + 1 || h.offsetHeight > maxH || copy.offsetHeight > room) && size > 34 && guard++ < 80){ size -= 2; h.style.fontSize = size + "px"; }
  if(copy.offsetHeight > room) slide.classList.add("grow");
}
function fitAll(){ deck.querySelectorAll(".head").forEach(fit); }
addEventListener("resize", ()=>requestAnimationFrame(fitAll));
if(document.fonts) document.fonts.ready.then(fitAll);
addEventListener("load", ()=>setTimeout(fitAll, 50));

// HUD + progress
const hud = document.getElementById("hud"), count = document.getElementById("count"), floatCta = document.getElementById("float");
let io;
function observe(){
  io && io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting && e.intersectionRatio > 0.55){
        const i = +e.target.dataset.i, s = slides[i];
        e.target.classList.add("in");
        hud.classList.toggle("on-cover", s.type === "select");
        cur = i;
        const vis = visible(), p = vis.indexOf(i);
        count.textContent = (SEC[s.sec] ? SEC[s.sec].short + "  \u00b7  " : (role ? ROLE[role].name + "  \u00b7  " : "")) + String(p+1).padStart(2,"0") + " / " + String(vis.length).padStart(2,"0");
        const dark = LIGHT.includes(s.tone) && !s.img; hud.style.setProperty("--hud-fg", dark ? "#111013" : "#FFFFFF"); hud.style.setProperty("--hud-bg", dark ? "#FFFFFF" : "#111013");
        document.querySelectorAll("#bar i").forEach((b,j)=>b.classList.toggle("on", j<=p));
        floatCta.classList.toggle("hide", s.type === "select" || s.type === "join" || s.type === "gate" || s.type === "cta" || s.type === "q" || s.type === "frog" || s.type === "orb");
      }
    });
  }, {threshold:[0.55]});
  deck.querySelectorAll(".slide").forEach(s=>io.observe(s));
}

function go(i){ if(i == null || i < 0) return; if(!visible().includes(i)){ setRole(null, false); } const el = document.getElementById("s"+(i+1)); el && el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }

  const pt = e.target.closest("[data-paths]"); if(pt){ const p = pt.nextElementSibling, open = p.hidden; p.hidden = !open; pt.setAttribute("aria-expanded", open); if(open) p.querySelector("button")?.focus(); const h = pt.closest(".slide")?.querySelector(".head"); h && fit(h); return; }
  const st = e.target.closest("[data-strike]"); if(st){ strike(st); return; }

  const sw = e.target.closest("[data-switch]"); if(sw){ closeMenu(false); go(slides.findIndex(s=>s.type==="select")); return; }
  const t = e.target.closest("[data-t]"); if(t){ tool(t.dataset.t, +t.closest(".slide").dataset.i); return; }
  const a = e.target.closest("[data-act]"); if(a){ act(a.dataset.act); }
});

function setRole(k, jump){
  role = k; try{ k ? localStorage.setItem(ROLE_KEY, k) : localStorage.removeItem(ROLE_KEY); }catch(e){}

function strike(li){
  li.classList.toggle("x");

// ---- Mini games (ported from the homepage-refresh V6 Play mockup, reskinned for EKUZO) ----
const GAME_BEST = {frog: 0, orb: null};
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
function initGames(){
  deck.querySelectorAll('[data-game="frog"]').forEach(initFrog);
  deck.querySelectorAll('[data-game="orb"]').forEach(initOrb);
}
function initOrb(root){
  const orb = root.querySelector(".orb"), q = k => root.querySelector(`[data-k="${k}"]`);
  let state = "idle", t0 = 0;
  orb.addEventListener("pointerdown", e => {
    e.preventDefault();
    if(state === "running"){
      const d = (performance.now() - t0) / 1000, off = Math.abs(d - 3);
      state = "result"; orb.classList.remove("live");
      q("big").textContent = d.toFixed(2) + "s"; q("sm").textContent = "tap to try again";
      const v = off < .05 ? "Perfect." : off < .15 ? "Sharp." : off < .4 ? "Close." : (d < 3 ? "Too early." : "Too late.");
      if(GAME_BEST.orb === null || off < GAME_BEST.orb) GAME_BEST.orb = off;
      q("verdict").textContent = `${v} ${off < .005 ? "Dead on" : off.toFixed(2) + "s off"}. Best: ${GAME_BEST.orb.toFixed(2)}s off. Nobody nails it first try. A coach tells you what you just did.`;
    } else {
      state = "running"; t0 = performance.now();
      if(!REDUCE) orb.classList.add("live");
      q("big").textContent = "Now"; q("sm").textContent = "tap at 3 seconds"; q("verdict").textContent = "";
    }
  });
}
function initFrog(root){
  const cv = root.querySelector("canvas"); if(!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, q = k => root.querySelector(`[data-k="${k}"]`);
  let flies = [], score = 0, running = false, endAt = 0, tongue = null;
  const fx = W/2, fy = H - 70;
  const spawn = () => flies.push({x: 60 + Math.random()*(W-120), y: 50 + Math.random()*(H-230), vx: (Math.random()-.5)*2.6, vy: (Math.random()-.5)*2, ph: Math.random()*6.28});
  function drawFrog(){
    ctx.fillStyle = "#49B41A";
    ctx.beginPath(); ctx.ellipse(fx, fy, 70, 46, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(fx-62, fy+22, 24, 13, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(fx+62, fy+22, 24, 13, 0, 0, 6.283); ctx.fill();
    [[-29,-39],[29,-39]].forEach(p => {
      ctx.fillStyle = "#49B41A"; ctx.beginPath(); ctx.arc(fx+p[0], fy+p[1], 21, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#F7F6F4"; ctx.beginPath(); ctx.arc(fx+p[0], fy+p[1], 13, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#0B0A12"; ctx.beginPath(); ctx.arc(fx+p[0]+(tongue?2:0), fy+p[1]-1, 6.5, 0, 6.283); ctx.fill();
    });
    ctx.strokeStyle = "rgba(11,10,18,.5)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(fx, fy-2, 31, .25, 2.9); ctx.stroke();
  }
  function drawFly(f, t){
    const bob = Math.sin(t/180 + f.ph)*3;
    ctx.fillStyle = "rgba(247,246,244,.38)";
    ctx.beginPath(); ctx.ellipse(f.x-11, f.y-9+bob, 11, 6, -.5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(f.x+11, f.y-9+bob, 11, 6, .5, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#E0FF4E"; ctx.beginPath(); ctx.ellipse(f.x, f.y+bob, 13, 9, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#0B0A12"; ctx.beginPath(); ctx.arc(f.x+7, f.y-2+bob, 3, 0, 6.283); ctx.fill();
  }
  function loop(t){
    if(!cv.isConnected) return;           // slide was re-rendered: stop this loop
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(73,180,26,.14)"; ctx.fillRect(0, H-34, W, 34);
    flies.forEach(f => {
      if(!REDUCE || running){ f.x += f.vx; f.y += f.vy; }
      if(f.x < 30 || f.x > W-30) f.vx *= -1;
      if(f.y < 36 || f.y > H-160) f.vy *= -1;
      drawFly(f, t);
    });
    if(tongue){
      ctx.strokeStyle = "#F92524"; ctx.lineWidth = 9; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(fx, fy-8); ctx.lineTo(tongue.x, tongue.y); ctx.stroke();
      if(t > tongue.until) tongue = null;
    }
    drawFrog();
    if(running){
      const left = Math.max(0, (endAt - performance.now())/1000);
      q("time").textContent = left.toFixed(0);
      if(left <= 0) stop();
    }
    requestAnimationFrame(loop);
  }
  function start(){
    flies = []; score = 0; q("score").textContent = "0"; running = true;
    endAt = performance.now() + 15000; q("msg").textContent = "Go. Tap the flies.";
    q("btn").textContent = "Restart";
    for(let i = 0; i < 5; i++) spawn();
  }
  function stop(){
    running = false; q("time").textContent = "0";
    if(score > GAME_BEST.frog){ GAME_BEST.frog = score; q("best").textContent = score; }
    q("msg").textContent = `You caught ${score}. Now imagine doing that while your squad calls targets.`;
    q("btn").textContent = "Play again";
  }
  function hit(mx, my){
    if(!running){ start(); return; }
    for(let i = flies.length-1; i >= 0; i--){
      const f = flies[i], dx = mx-f.x, dy = my-f.y;
      if(dx*dx + dy*dy < 34*34){
        tongue = {x: f.x, y: f.y, until: performance.now() + 140};
        flies.splice(i, 1); score++; q("score").textContent = score; spawn();
        if(Math.random() < .35) spawn();
        return;
      }
    }
  }
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    hit((e.clientX - r.left) * (W/r.width), (e.clientY - r.top) * (H/r.height));
  });
  q("btn").addEventListener("click", start);
  for(let i = 0; i < 4; i++) spawn();
  requestAnimationFrame(loop);
}

function tool(t, i){
  const s = slides[i];
  if(t === "sec"){ const ks = [...SECTIONS.map(x=>x.k), undefined]; s.sec = ks[(ks.indexOf(s.sec)+1) % ks.length]; if(!s.sec) delete s.sec; }
  if(t === "tone") s.tone = TONES[(TONES.indexOf(s.tone)+1) % TONES.length];
  if(t === "img"){ const n = IMG_KEYS[(IMG_KEYS.indexOf(s.img ?? null)+1) % IMG_KEYS.length]; if(n) s.img = n; else delete s.img; s.pos = "50% 40%"; }
  if(t === "up" && i > 0){ [slides[i-1], slides[i]] = [slides[i], slides[i-1]]; i--; }
  if(t === "down" && i < slides.length-1){ [slides[i+1], slides[i]] = [slides[i], slides[i+1]]; i++; }
  if(t === "dup"){ slides.splice(i+1, 0, structuredClone(s)); i++; }
  if(t === "del"){ if(slides.length > 1){ slides.splice(i,1); i = Math.max(0,i-1); } }
  save(); render(); requestAnimationFrame(()=>document.getElementById("s"+(i+1))?.scrollIntoView({behavior:"auto"}));
}
function act(a){
  if(a === "done") return setEditing(false);
  if(a === "add"){ const at = Math.min(cur+1, slides.length-1); slides.splice(at, 0, {sec:slides[cur]?.sec, tone:"ink", kicker:"New beat", head:"New headline.", sub:"One sentence that lands the idea."}); save(); render(); requestAnimationFrame(()=>go(at)); msg.textContent = "Added after this slide" + (SEC[slides[at].sec] ? " in " + SEC[slides[at].sec].name + "." : "."); return; }
  if(a === "reset"){ slides = structuredClone(DEFAULT_SLIDES); try{ localStorage.removeItem(KEY); }catch(e){} render(); msg.textContent = "Back to the original story."; return; }
  if(a === "export"){
    const txt = slides.map((s,i)=>`${String(i+1).padStart(2,"0")} \u00b7 ${s.tone}${s.img?" \u00b7 photo: "+s.img:""}${s.type?" \u00b7 "+s.type:""}${s.sec?" \u00b7 "+s.sec:""}\n${s.kicker?s.kicker.toUpperCase()+"\n":""}${s.head}\n${s.sub}${s.opts ? "\n" + s.opts.map(([a,b])=>"  - " + a + ": " + b).join("\n") : ""}`).join("\n\n");
    const ta = document.getElementById("exportText"); ta.value = txt;
    const done = ()=>{ msg.textContent = "Story copied. Paste it to Claude or a doc."; };
    try{ navigator.clipboard.writeText(txt).then(done, ()=>{ document.getElementById("export").classList.add("open"); ta.select(); }); }
    catch(e){ document.getElementById("export").classList.add("open"); ta.select(); }
  }
}
document.getElementById("exportClose").addEventListener("click", ()=>document.getElementById("export").classList.remove("open"));

render();

// Deep links: an ad or QR code can drop someone straight onto their path, e.g. #parent or #player.
function fromHash(){ const k = (location.hash || "").slice(1).toLowerCase(); if(ROLE[k]) setRole(k, true); }
fromHash();
addEventListener("hashchange", fromHash);
</script>
