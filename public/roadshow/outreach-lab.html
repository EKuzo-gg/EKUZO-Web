<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Outreach Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "Tungsten Narrow"; src: url("/fonts/TungstenNarrow-Black.otf") format("opentype"); font-weight: 900; font-display: swap; }
:root {
  --red: #f92524; --black: #000; --white: #fff; --grey: #efeeed;
  --ink: rgba(0,0,0,1); --ink-70: rgba(0,0,0,.7); --ink-60: rgba(0,0,0,.6); --ink-15: rgba(0,0,0,.15); --ink-08: rgba(0,0,0,.08);
  --on-dark-70: rgba(255,255,255,.7); --on-dark-60: rgba(255,255,255,.6); --on-dark-20: rgba(255,255,255,.2);
  --display: "Tungsten Narrow", "Oswald", sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --notch: polygon(40px 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%, 0 40px);
  --notch-sm: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
  --side: 264px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font: 16px/1.5 var(--body); color: var(--ink); background: var(--white); -webkit-font-smoothing: antialiased; }
::selection { background: var(--red); color: var(--white); }
a { color: inherit; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--black); outline-offset: 3px; }
.dark :focus-visible { outline-color: var(--white); }
button { font: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, .h3, .nm, .ct, .s-t, .quote, .subhead { text-wrap: balance; }
p { text-wrap: pretty; }
.display { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .02em; line-height: .9; }

/* Shell */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--black); color: var(--white); display: flex; flex-direction: column; padding: 28px 0 24px; overflow-y: auto; z-index: 10; }
.brand { padding: 0 24px 24px; border-bottom: 1px solid var(--on-dark-20); }
.brand .who { font: 700 12px/1 var(--body); letter-spacing: .15em; text-transform: uppercase; color: var(--on-dark-60); }
.brand .name { font-size: 40px; margin-top: 10px; white-space: nowrap; }
.brand .name span { color: var(--red); }
.nav { list-style: none; margin: 0; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav .group { font: 700 11px/1 var(--body); letter-spacing: .15em; text-transform: uppercase; color: var(--on-dark-60); padding: 18px 12px 8px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; text-decoration: none; color: var(--on-dark-70); font-size: 15px; border-radius: 2px; transition: background .15s ease-out, color .15s ease-out; }
.nav a:hover { color: var(--white); background: rgba(255,255,255,.08); }
.nav a[aria-current="page"] { color: var(--black); background: var(--white); font-weight: 700; }
.nav .n { font: 700 12px/1 var(--body); width: 22px; height: 22px; display: grid; place-items: center; border: 1.5px solid currentColor; border-radius: 50%; flex: none; }
.nav a[aria-current="page"] .n { background: var(--red); border-color: var(--red); color: var(--white); }
.side .foot { margin-top: auto; padding: 16px 24px 0; font-size: 12px; color: var(--on-dark-60); }
main { margin-left: var(--side); min-height: 100vh; }
.view { display: none; }
.view.on { display: block; animation: rise .35s cubic-bezier(.16,1,.3,1); }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view.on { animation: none; } html { scroll-behavior: auto; } }

/* Bands */
.band { padding: 56px clamp(24px, 5vw, 72px); }
.band.red { background: var(--red); color: var(--white); }
.band.black { background: var(--black); color: var(--white); }
.band.grey { background: var(--grey); }
.wrap { max-width: 1180px; margin: 0 auto; }
.subhead { font: 300 clamp(20px, 2.2vw, 28px)/1.3 var(--body); letter-spacing: -.3px; margin-top: 14px; max-width: 52ch; text-wrap: balance; }
.band.red .subhead, .band.black .subhead { color: var(--white); }
.h1 { font-size: clamp(52px, 9vw, 120px); margin-top: 18px; overflow-wrap: anywhere; }
.lede { font-size: 19px; max-width: 62ch; margin-top: 18px; color: inherit; opacity: .85; }
.h2 { font: 700 clamp(28px, 3.2vw, 40px)/1.05 var(--body); letter-spacing: -1.28px; }
.h3 { font: 700 20px/1.2 var(--body); letter-spacing: -.4px; }
.sub { color: var(--ink-70); margin-top: 8px; max-width: 68ch; }
.dark .sub, .band.black .sub { color: var(--on-dark-70); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }

/* Phase key */
.key { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-70); }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.p-reach { background: #8f8e8d; }
.p-rapport { background: var(--black); }
.p-partner { background: var(--red); }

/* Lane board */
.board { border-top: 2px solid var(--black); }
.row { display: grid; grid-template-columns: minmax(210px, 1.2fr) 2.1fr minmax(170px, .9fr) 28px; gap: 24px; align-items: center; padding: 18px 8px; border-bottom: 1px solid var(--ink-15); text-decoration: none; transition: background .15s ease-out; }
.row:hover { background: var(--grey); }
.row .ln { display: flex; gap: 14px; align-items: center; }
.row .num { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; width: 34px; color: var(--red); }
.row .nm { font-weight: 700; font-size: 17px; line-height: 1.2; }
.row .tg { font-size: 13px; color: var(--ink-60); margin-top: 2px; }
.row .status { font-size: 14px; color: var(--ink-70); }
.row .status b { color: var(--ink); }
.row .go { display: grid; place-items: center; }
.row .go svg { width: 20px; height: 20px; transition: transform .15s ease-out; }
.row:hover .go svg { transform: translateX(3px); }
.track { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; align-items: center; }
.track .d { height: 10px; border-radius: 1px; background: var(--grey); box-shadow: inset 0 0 0 1px var(--ink-08); position: relative; }
.track .d.r { background: #8f8e8d; box-shadow: none; }
.track .d.ra { background: var(--black); box-shadow: none; }
.track .d.pa { background: var(--red); box-shadow: none; }
.track .d.owed { background: repeating-linear-gradient(135deg, var(--red) 0 3px, transparent 3px 6px); outline: 1.5px solid var(--red); outline-offset: -1.5px; }
.track-labels { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; font-size: 11px; color: var(--ink-60); margin-bottom: 6px; }
.board-head { display: grid; grid-template-columns: minmax(210px, 1.2fr) 2.1fr minmax(170px, .9fr) 28px; gap: 24px; padding: 0 8px 10px; align-items: end; font: 700 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-60); }

/* (stuck callout removed) */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--black); padding: 11px 20px; font-weight: 700; font-size: 15px; text-decoration: none; background: var(--black); color: var(--white); border-radius: 2px; transition: opacity .15s ease-out, transform .1s; }
.btn:hover { opacity: .9; }
.btn:active { transform: scale(.98); }
.btn.red { background: var(--red); border-color: var(--red); }
.btn.ghost { background: transparent; color: var(--black); }
.btn.ghost:hover { background: var(--black); color: var(--white); opacity: 1; }
.dark .btn.ghost { color: var(--white); border-color: var(--white); }
.dark .btn.ghost:hover { background: var(--white); color: var(--black); }

/* Pathway */
.loop { width: 100%; height: auto; display: block; }
.kit { border-top: 2px solid var(--black); }
.kit-row { display: grid; grid-template-columns: 240px 1fr 260px; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--ink-15); align-items: baseline; }
.kit-row .h3 { font-size: 17px; }
.kit-row p { font-size: 15px; color: var(--ink-70); }
.kit-row .lanes { font-size: 14px; color: var(--ink-60); }

/* Journey map */
.jmap-wrap { overflow-x: auto; padding-bottom: 8px; scrollbar-color: var(--black) var(--grey); }
.jmap { display: grid; grid-template-columns: 132px repeat(10, minmax(150px, 1fr)); min-width: 1640px; }
.jmap .phase { padding: 10px 12px; font: 700 12px/1 var(--body); letter-spacing: .15em; text-transform: uppercase; color: var(--white); }
.jmap .phase.reach { background: #6d6c6b; }
.jmap .phase.rapport { background: var(--black); }
.jmap .phase.partner { background: var(--red); }
.jmap .stage { padding: 14px 12px 12px; border-bottom: 2px solid var(--black); }
.jmap .stage .s-n { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; }
.jmap .stage .s-t { font-weight: 700; font-size: 15px; line-height: 1.2; margin-top: 4px; }
.jmap .rl { padding: 14px 12px; font: 700 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-60); border-bottom: 1px solid var(--ink-15); background: var(--white); position: sticky; left: 0; z-index: 1; }
.jmap .c { padding: 12px; font-size: 13.5px; line-height: 1.4; border-bottom: 1px solid var(--ink-15); border-left: 1px solid var(--ink-08); }
.jmap .c.stuckcol { background: rgba(249,37,36,.07); }
.jmap .tpl { display: inline-block; font-weight: 700; font-size: 12px; padding: 3px 8px; border: 1.5px solid var(--black); text-decoration: none; border-radius: 2px; }
.jmap .tpl:hover { background: var(--black); color: var(--white); }
.jmap .emotion { display: flex; align-items: center; justify-content: center; }
.mood { width: 100%; height: 56px; display: block; }
.stuck-tag { display: inline-block; margin-top: 6px; font: 700 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--red); }


/* Journey chevrons */
.phases { display: grid; grid-template-columns: 4fr 3fr 3fr; gap: 4px; margin-bottom: 6px; }
.phases div { font: 700 12px/1 var(--body); letter-spacing: .15em; text-transform: uppercase; padding: 8px 0; border-top: 4px solid; }
.phases .reach { border-color: #8f8e8d; color: rgba(0,0,0,.6); }
.phases .rapport { border-color: #000; }
.phases .partner { border-color: var(--red); color: var(--red); }
.chev { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.chev button { border: 0; text-align: left; min-height: 96px; padding: 12px 18px 12px 20px; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); background: var(--grey); color: var(--black); transition: background .15s ease-out, color .15s ease-out; display: flex; flex-direction: column; gap: 4px; }
.chev button:first-child { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); padding-left: 14px; }
.chev button .cn { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; }
.chev button .ct { font-size: 13px; font-weight: 700; line-height: 1.2; }
.chev button:hover { background: #dedcda; }
.chev button.reach[aria-pressed="true"] { background: #8f8e8d; color: #fff; }
.chev button.rapport[aria-pressed="true"] { background: #000; color: #fff; }
.chev button.partner[aria-pressed="true"] { background: var(--red); color: #fff; }
.chev button .flag { font: 700 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--red); margin-top: auto; }
.chev button[aria-pressed="true"] .flag { color: inherit; }
.jdetail { margin-top: 28px; background: var(--grey); clip-path: var(--notch); padding: 32px 36px; display: grid; grid-template-columns: 200px 1fr; gap: 32px; }
.jdetail .bign { font-family: var(--display); font-weight: 900; font-size: 140px; line-height: .8; }
.jdetail .bigt { font: 700 22px/1.15 var(--body); margin-top: 10px; letter-spacing: -.4px; text-wrap: balance; }
.jfields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 28px; align-content: start; }
.jfields .lab { font: 700 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 8px; }
.jfields .val { font-size: 16px; }
.jfields .val .tpl { display: inline-block; font-weight: 700; font-size: 13px; padding: 5px 10px; border: 2px solid var(--black); text-decoration: none; border-radius: 2px; background: #fff; }
.jfields .val .tpl:hover { background: var(--black); color: #fff; }
.jnav { display: flex; gap: 10px; margin-top: 24px; grid-column: 2; }
details.full { margin-top: 40px; }
details.full summary { cursor: pointer; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; padding: 10px 16px; border: 2px solid var(--black); border-radius: 2px; list-style: none; }
details.full summary::-webkit-details-marker { display: none; }
details.full[open] summary { background: var(--black); color: #fff; }
@media (max-width: 960px) {
  .phases { display: none; }
  .chev { grid-template-columns: repeat(5, 1fr); }
  .chev button, .chev button:first-child { clip-path: none; padding: 10px; min-height: 84px; }
  .chev button .ct { font-size: 12px; }
  .jdetail { grid-template-columns: 1fr; padding: 24px; gap: 16px; }
  .jdetail .bign { font-size: 90px; }
  .jfields { grid-template-columns: 1fr 1fr; }
  .jnav { grid-column: 1; }
}

@media (max-width: 1279px) {
  .phases { display: none; }
  .chev { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .chev button, .chev button:first-child { clip-path: none; padding: 12px; }
  .mood-wrap { display: none; }
  .jdetail { grid-template-columns: 1fr; gap: 20px; }
  .jnav { grid-column: 1; }
}
/* Lane page */
.lane-hero { display: block; }
.lane-hero .num { font-family: var(--display); font-weight: 900; font-size: clamp(120px, 15vw, 200px); line-height: .75; opacity: .9; }
.quote { font-size: clamp(22px, 2.4vw, 30px); font-weight: 700; letter-spacing: -.6px; line-height: 1.2; max-width: 34ch; margin-top: 22px; }
.quote small { display: block; font-size: 14px; font-weight: 400; letter-spacing: 0; margin-top: 10px; opacity: .8; }
.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 2px solid var(--black); }
.role { padding: 20px 24px 22px 0; }
.role + .role { padding-left: 24px; border-left: 1px solid var(--ink-15); }
.role .lab { display: flex; align-items: center; gap: 10px; font: 700 12px/1 var(--body); letter-spacing: .15em; text-transform: uppercase; color: var(--ink-60); }
.role .lab svg { width: 26px; height: 26px; }
.role .h3 { margin-top: 12px; font-size: 18px; }
.role p { font-size: 14px; color: var(--ink-70); margin-top: 6px; }
.trade { display: grid; grid-template-columns: 1fr 72px 1fr; align-items: stretch; }
.trade .side-b { padding: 28px; clip-path: var(--notch); }
.trade .give { background: var(--black); color: var(--white); }
.trade .ask { background: var(--white); }
.trade .arrows { display: grid; place-items: center; }
.trade ul { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.trade li { padding-left: 22px; position: relative; font-size: 16px; }
.trade li::before { content: ""; position: absolute; left: 0; top: .55em; width: 10px; height: 10px; background: var(--red); }
.flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; position: relative; }
.step { position: relative; padding: 0 18px 0 0; }
.step .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 24px; color: var(--white); position: relative; z-index: 1; }
.step::before { content: ""; position: absolute; left: 44px; right: 0; top: 21px; height: 2px; background: var(--black); }
.step:last-child::before { display: none; }
.step .k { font: 700 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-60); margin-top: 16px; }
.step .h3 { font-size: 16px; margin-top: 6px; }
.step p { font-size: 14px; color: var(--ink-70); margin-top: 6px; }
.step .tpl { display: inline-block; margin-top: 10px; font: 700 12px/1 var(--body); padding: 6px 10px; border: 1.5px solid var(--black); text-decoration: none; border-radius: 2px; }
.step .tpl:hover { background: var(--black); color: var(--white); }
.pilots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 28px; }
.pilot { border-top: 4px solid var(--red); padding-top: 16px; }
.pilot .pic { height: 92px; margin-bottom: 14px; }
.pilot .pic svg { height: 100%; width: auto; }
.pilot p { font-size: 15px; color: var(--ink-70); margin-top: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.watch { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; }
.watch li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 15px; }
.watch li svg { width: 22px; height: 22px; margin-top: 1px; }
.deliv { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
.deliv li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 14px; background: var(--white); font-size: 15px; }
.chip { font: 700 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 2px; white-space: nowrap; }
.chip.owed { background: var(--red); color: var(--white); }
.chip.exists { background: var(--black); color: var(--white); }
.chip.build { border: 1.5px solid var(--black); }
.contacts { width: 100%; border-collapse: collapse; font-size: 15px; }
.contacts th { text-align: left; font: 700 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--on-dark-60); padding: 0 12px 10px 0; border-bottom: 1px solid var(--on-dark-20); }
.contacts td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--on-dark-20); vertical-align: top; color: var(--on-dark-70); }
.contacts td:first-child { color: var(--white); font-weight: 700; }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; }
.meter i { width: 8px; height: 14px; background: var(--on-dark-20); }
.meter i.on { background: var(--red); }
.empty { color: var(--on-dark-70); font-size: 16px; max-width: 60ch; }
.lane-nav { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* Templates */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { border: 2px solid var(--black); background: transparent; padding: 8px 14px; font-weight: 700; font-size: 14px; border-radius: 2px; transition: background .15s, color .15s; }
.tabs button[aria-pressed="true"] { background: var(--black); color: var(--white); }
.tabs button:hover { background: var(--black); color: var(--white); }
.composer { display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start; }
.controls { display: grid; gap: 18px; }
.controls label { display: block; font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 8px; }
select { width: 100%; font: 16px var(--body); padding: 11px 12px; border: 2px solid var(--black); border-radius: 2px; background: var(--white); appearance: none; background-image: linear-gradient(45deg, transparent 50%, #000 50%), linear-gradient(135deg, #000 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
.note { font-size: 14px; color: var(--ink-70); background: var(--grey); padding: 14px 16px; }
.mail { background: var(--white); border: 2px solid var(--black); border-radius: 2px; }
.mail .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--black); color: var(--white); font-size: 13px; }
.mail .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--on-dark-20); }
.mail .bar .t { margin-left: 8px; font-weight: 700; }
.mail .bar button { margin-left: auto; background: var(--red); color: var(--white); border: 0; padding: 7px 14px; font-weight: 700; font-size: 13px; border-radius: 2px; }
.mail .bar button:hover { opacity: .9; }
.mail .fld { display: grid; grid-template-columns: 72px 1fr; padding: 10px 18px; border-bottom: 1px solid var(--ink-15); font-size: 15px; }
.mail .fld span:first-child { color: var(--ink-60); }
.mail .body { padding: 20px 18px 24px; font-size: 16px; line-height: 1.6; white-space: pre-wrap; max-width: 70ch; }
.slot { background: rgba(249,37,36,.12); border-bottom: 2px solid var(--red); padding: 0 3px; }
.fill { background: rgba(0,0,0,.06); border-bottom: 2px solid var(--black); padding: 0 3px; }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--ink-70); flex-wrap: wrap; margin-top: 12px; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; }
.tcard .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.tcard .meta .code { font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--red); line-height: 1; }
.tcard .meta .when { font-size: 13px; color: var(--ink-60); }
.tcard .mail .body { font-size: 15px; padding: 16px 18px 18px; }
.sms { max-width: 360px; }
.sms .bubble { background: var(--black); color: var(--white); padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; margin-left: auto; width: fit-content; max-width: 100%; }

/* One-pagers */
.skel { display: grid; grid-template-columns: 300px 1fr; gap: 40px; align-items: center; }

.page .ln { height: 6px; background: var(--ink-15); }
.page .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.page .col { padding: 8px; display: grid; gap: 5px; align-content: start; }
.page .col.k { background: var(--black); }
.page .col.k .ln { background: var(--on-dark-20); }
.page .col.p { background: var(--grey); }

.page .first .ln { background: rgba(249,37,36,.35); }
.page .foot { margin-top: auto; display: flex; gap: 8px; align-items: center; }
.page .foot .av { width: 22px; height: 22px; border-radius: 50%; background: var(--black); flex: none; }
.anat { list-style: none; counter-reset: a; padding: 0; margin: 0; display: grid; gap: 16px; }
.anat li { counter-increment: a; display: grid; grid-template-columns: 44px 1fr; gap: 12px; }
.anat li::before { content: counter(a); font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; color: var(--red); }
.anat b { display: block; font-size: 17px; }
.anat span { font-size: 15px; color: var(--ink-70); }
.op-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 36px 28px; }
.op .page { padding: 30px 18px 18px; gap: 9px; background: var(--grey); clip-path: var(--notch-sm); }
.op .page .hl { font-size: 23px; }
.op .page .ln { height: 5px; }
.op .meta { margin-top: 14px; }
.op .meta .for { font-size: 13px; color: var(--ink-60); margin-top: 4px; }
.op .clears { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; font-size: 14px; }
.op .clears li { padding-left: 18px; position: relative; }
.op .clears li::before { content: ""; position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border: 2px solid var(--red); }
.prio { font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--red); }

/* Decisions */
.dec { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--white); }
.dec li { display: grid; grid-template-columns: 34px 1fr auto; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--on-dark-20); align-items: start; }
.dec input { width: 22px; height: 22px; accent-color: var(--red); margin-top: 3px; }
.dec .q { font-weight: 700; font-size: 17px; }
.dec .w { font-size: 14px; color: var(--on-dark-70); margin-top: 4px; }
.dec .own { font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid var(--on-dark-60); padding: 6px 8px; white-space: nowrap; }
.dec li.first .q::after { content: "Blocks the one-pagers"; margin-left: 10px; font: 700 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; background: var(--red); padding: 4px 6px; vertical-align: 3px; }

/* Mobile */
.topbar { display: none; }
@media (max-width: 960px) {
  .side { display: none; }
  main { margin-left: 0; }

  .row, .board-head { grid-template-columns: 1fr; gap: 10px; }
  .board-head { display: none; }
  .row .go { display: none; }
  .roles { grid-template-columns: 1fr; }
  .role + .role { padding-left: 0; border-left: 0; border-top: 1px solid var(--ink-15); }
  .trade { grid-template-columns: 1fr; }
  .trade .arrows { padding: 8px 0; transform: rotate(90deg); }
  .flow { grid-template-columns: 1fr; gap: 22px; }
  .step::before { left: 21px; top: 44px; bottom: -22px; right: auto; width: 2px; height: auto; }

  .step .dot { position: absolute; left: 0; top: 0; }
  .step .k { margin-top: 4px; }
  .two, .composer, .skel { grid-template-columns: 1fr; gap: 32px; }
  .kit-row { grid-template-columns: 1fr; gap: 4px; }
  .skel .page { max-width: 300px; }
  .lane-hero { grid-template-columns: 1fr; }
  .lane-hero .num { display: none; }
  .tgrid { grid-template-columns: 1fr; }
  .dec li { grid-template-columns: 30px 1fr; }
  .dec .own { grid-column: 2; justify-self: start; }
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const phaseOf = n => STAGES[n].ph;
function track(stage, owed) {
  let h = '<div class="track" aria-label="Furthest stage: ' + stage + (owed ? ", next stage owed by us" : "") + '">';
  for (let i = 0; i < 10; i++) {
    let c = "d";
    if (i <= stage) c += phaseOf(i) === "reach" ? " r" : phaseOf(i) === "rapport" ? " ra" : " pa";
    if (owed && i === stage + 1) c += " owed";
    h += '<span class="' + c + '" title="' + i + ' ' + esc(STAGES[i].t) + '"></span>';
  }
  return h + "</div>";
}
function slots(text) {
  return esc(text).replace(/\[([^\]]+)\]/g, '<span class="slot">[$1]</span>');
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { toast("Copy blocked here. Select the text instead."); }
}

        ${f("Our touchpoint", esc(s.touch))}
        ${f("Template", s.tpl ? `<a class="tpl" href="#templates" data-tpl="${s.tpl}">Open ${s.tpl}</a>` : "Call card (meeting brief)")}
        ${f("Asset", esc(s.asset))}
        ${f("Done when", esc(s.exit))}
        ${f("Timing", esc(s.time))}
      </div>
      <div class="jnav">
        ${n > 0 ? `<button type="button" class="btn ghost" data-go="${n - 1}">${AL} ${esc(STAGES[n - 1].t)}</button>` : ""}
        ${n < 9 ? `<button type="button" class="btn" data-go="${n + 1}">${esc(STAGES[n + 1].t)} ${AR}</button>` : ""}
      </div>
    </div>`;
  document.querySelectorAll("#jdetail [data-go]").forEach(b => b.onclick = () => showStage(+b.dataset.go));
}

function viewLane(l) {
  const i = LANES.indexOf(l), prev = LANES[i - 1], next = LANES[i + 1];
  const role = (k, label, v) => `<div class="role"><div class="lab">${IC[k]}${label}</div><h3 class="h3">${esc(v[0])}</h3>${v[1] ? `<p>${esc(v[1])}</p>` : ""}</div>`;
  const steps = [
    ["1", "First touch", "Hook", l.hook.s, l.hook.t, "T1"],
    ["5", "First yes", "Small yes", l.firstYes, "Proposed in the thank-you, not asked for in the room.", "T4"],
    ["6", "Karlin", "Believe it", l.karlin, "No ask until Karlin has won them over.", "T5"],
    ["7", "Proposal", "Show their team", l.proposal, "One-pager plus a pilot shape, then a working session.", "T6"],
    ["9", "Expand", "Keep going", "Recap, renewal, \"who else?\"", "Every pilot ends with a name.", "T8"]
  ].map(([n, k, kk, h, p, t]) => `<div class="step"><div class="dot" style="background:${+n >= 7 ? "#f92524" : "#000"}">${n}</div><div class="k">${k}</div><h3 class="h3">${esc(h)}</h3><p>${esc(p)}</p><a class="tpl" href="#templates" data-tpl="${t}" data-lane="${l.id}">Template ${t}</a></div>`).join("");
  const contacts = l.austin.length ? `<table class="contacts"><thead><tr><th>Who</th><th>Org</th><th>Interest</th><th>Next</th></tr></thead><tbody>${l.austin.map(a => `<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${a[2] == null ? "<span style='color:rgba(255,255,255,.6)'>new</span>" : `<span class="meter" aria-label="${a[2]} of 5">${[1,2,3,4,5].map(x => `<i class="${x <= a[2] ? "on" : ""}"></i>`).join("")}</span>`}</td><td>${esc(a[3])}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No conversations yet. ${esc(l.status)}</p>`;
  return `
  <section class="band red dark"><div class="wrap lane-hero">
    <div>
      <h1 class="display h1">${esc(l.name)}</h1>
      <p class="subhead">Lane ${l.num} · ${esc(l.tag)}</p>
      <p class="quote">&ldquo;${esc(l.quote)}&rdquo;<small>${esc(l.who_said)}</small></p>
    </div>
  </div></section>
  <section class="band"><div class="wrap">
    <p style="font-size:19px;max-width:64ch">${esc(l.why)}</p>
    <div style="margin-top:20px;max-width:620px">${track(l.stage, l.owed)}<div class="track-labels" style="margin-top:6px">${STAGES.map(s => `<span>${s.n}</span>`).join("")}</div></div>
    <h2 class="h2" style="margin-top:48px;margin-bottom:20px">Who's in the room</h2>
    <div class="roles">${role("champion", "Champion", l.roles.champion)}${role("decider", "Decider", l.roles.decider)}${role("gate", "Gatekeeper", l.roles.gate)}</div>
  </div></section>
  <section class="band grey"><div class="wrap">
    <h2 class="h2" style="margin-bottom:24px">The trade</h2>
    <div class="trade">
      <div class="side-b give dark"><h3 class="h3">We give</h3><ul>${l.give.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>
      <div class="arrows" aria-hidden="true">${IC.arrows}</div>
      <div class="side-b ask"><h3 class="h3">We ask</h3><ul>${l.ask.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>
    </div>
  </div></section>
  <section class="band"><div class="wrap">
    <div class="sec-head"><div><h2 class="h2">This lane's journey</h2><p class="sub">The five moments that matter here. Numbers are the shared journey's stages.</p></div><a class="btn ghost" href="#journey">Full journey map</a></div>
    <div class="flow">${steps}</div>
  </div></section>
  <section class="band grey"><div class="wrap">
    <h2 class="h2" style="margin-bottom:28px">Pilot shapes</h2>
    <div class="pilots">${l.pilots.map(p => `<div class="pilot"><div class="pic" aria-hidden="true">${pic(p.pic)}</div><h3 class="h3">${esc(p.n)}</h3><p>${esc(p.d)}</p></div>`).join("")}</div>
  </div></section>
  <section class="band"><div class="wrap two">
    <div><h2 class="h2">Watch for</h2><ul class="watch">${l.watch.map(w => `<li>${IC.warn}<span>${esc(w)}</span></li>`).join("")}</ul></div>
    <div><h2 class="h2">Deliverables</h2><ul class="deliv" style="background:var(--grey);padding:10px">${l.deliver.map(d => `<li><span>${esc(d[0])}</span><span class="chip ${d[1]}">${d[1] === "owed" ? "Owed now" : d[1] === "exists" ? "Exists" : "To build"}</span></li>`).join("")}</ul></div>
  </div></section>
  <section class="band" style="padding-top:0"><div class="wrap">
    <div class="lane-nav" style="border-top:2px solid #000;padding-top:28px">
      ${prev ? `<a class="btn ghost" href="#lane-${prev.id}">${AL} ${esc(prev.name)}</a>` : `<a class="btn ghost" href="#journey">${AL} Journey map</a>`}
      ${next ? `<a class="btn ghost" href="#lane-${next.id}">${esc(next.name)} ${AR}</a>` : `<a class="btn ghost" href="#templates">Templates ${AR}</a>`}
    </div>
  </div></section>`;
}

function buildT1(sender, hook) {
  const S = SENDERS[sender], H = HOOKS[hook];
  const parts = [
    S.greet("[Name]"),
    S.line1,
    H.l2,
    "Btw, [one specific, recent, checkable thing about them], [one short line tying it to EKUZO, or one easy question].",
    H.ask,
    S.txt,
    S.sign
  ].filter(Boolean);
  return { subject: H.s, body: parts.join("\n\n") };
}
function renderT1() {
  const sender = $("#t1-sender").value, hook = $("#t1-lane").value;
  const m = buildT1(sender, hook), S = SENDERS[sender], H = HOOKS[hook];
  const b = [
    `<span class="fill">${slots(S.greet("[Name]"))}</span>`,
    `<span class="fill">${slots(S.line1)}</span>`,
    `<span class="fill">${slots(H.l2)}</span>`,
    slots("Btw, [one specific, recent, checkable thing about them], [one short line tying it to EKUZO, or one easy question]."),
    H.ask ? `<span class="fill">${slots(H.ask)}</span>` : "",
    S.txt ? esc(S.txt) : "",
    esc(S.sign)
  ].filter(Boolean).join("\n\n");
  $("#t1-subj").innerHTML = slots(m.subject);
  $("#t1-body").innerHTML = b;
  $("#t1-copy").onclick = () => copy("Subject: " + m.subject + "\n\n" + m.body);
}

function viewTemplates() {
  const laneOpts = Object.entries(HOOKS).map(([k, v]) => `<option value="${k}">${esc(v.lane)}</option>`).join("");
  const cards = TEMPLATES.map(t => `
    <div class="tcard" id="tpl-${t.code}">
      <div class="meta"><div><span class="code">${t.code}</span> <span class="h3" style="margin-left:6px">${esc(t.name)}</span></div></div>
      <div class="when" style="font-size:13px;color:rgba(0,0,0,.6);margin:-4px 0 10px">${esc(t.stage)}</div>
      <div class="mail">
        <div class="bar"><i></i><i></i><i></i><span class="t">${t.code}</span><button type="button" data-copy="${t.code}">Copy</button></div>
        <div class="fld"><span>Subject</span><span>${slots(t.subj)}</span></div>
        <div class="body">${slots(t.body)}</div>
      </div>
    </div>`).join("");
  return `
  <section class="band"><div class="wrap">
    <h2 class="h2">A message for every touchpoint.</h2>
    <p class="subhead">Shapes, not scripts. Red slots get filled per person. The sender's voice file always wins, and nothing from the can't-say list goes in: no dates, prices, credit claims, or anything about a specific child.</p>
  </div></section>
  <section class="band grey" id="tpl-T1"><div class="wrap">
    <div class="sec-head"><div><h2 class="h2"><span style="font-family:var(--display);font-weight:900;color:var(--red);font-size:44px;letter-spacing:.02em">T1</span>&nbsp; First touch builder</h2><p class="sub">Pick the sender and the lane. Built only to get a reply: no attachments, no list ask.</p></div></div>
    <div class="composer">
      <div class="controls">
        <div><label for="t1-sender">Sender</label><select id="t1-sender"><option value="jamie">Jamie (Austin)</option><option value="karlin">Karlin (Seattle, Houston)</option></select></div>
        <div><label for="t1-lane">Lane</label><select id="t1-lane">${laneOpts}</select></div>
        <p class="note">Karlin's line 1 is word for word from his file. Jamie picks his line 1 for the reader (gamer, dad, founder, adviser). Riot uses its own shape in Karlin's file.</p>
      </div>
      <div>
        <div class="mail">
          <div class="bar"><i></i><i></i><i></i><span class="t">New message</span><button type="button" id="t1-copy">Copy</button></div>
          <div class="fld"><span>To</span><span class="slot" style="width:fit-content">[verified address]</span></div>
          <div class="fld"><span>Subject</span><span id="t1-subj"></span></div>
          <div class="body" id="t1-body"></div>
        </div>
        <div class="legend"><span><span class="fill">Filled</span> from the sender and lane</span><span><span class="slot">[Slot]</span> you write per person</span></div>
      </div>
    </div>
  </div></section>
  <section class="band"><div class="wrap">
    <h2 class="h2" style="margin-bottom:28px">Every other step</h2>
    <div class="tgrid">${cards}</div>
    <h2 class="h2" style="margin:56px 0 18px">By text</h2>
    <div class="sms"><div class="bubble">Hi [Name], it's [Sender] from EKUZO. [The same ask, in one line]?</div><p class="sub" style="font-size:14px">Same ask, one line, sender's name first, no links on a first text.</p></div>
  </div></section>`;
}

function viewOnepagers() {
  const mini = o => `<div class="page" aria-hidden="true"><div class="hl">${esc(o.hl)}</div><div class="ln"></div><div class="ln" style="width:80%"></div><div class="cols"><div class="col k"><div class="ln"></div><div class="ln"></div><div class="ln" style="width:60%"></div></div><div class="col p"><div class="ln"></div><div class="ln"></div><div class="ln" style="width:60%"></div></div></div><div class="first"><div class="ln"></div><div class="ln" style="width:70%"></div></div><div class="foot"><span class="av"></span><div class="ln" style="flex:1"></div></div></div>`;
  return `
  <section class="band"><div class="wrap">
    <h2 class="h2">Eight one-pagers, one family.</h2>
    <p class="subhead">Same five-part skeleton every time, with the lane's headline and photo swapped. Build them in priority order: the first five move 12 of 20 Austin threads.</p>
  </div></section>
  <section class="band grey"><div class="wrap skel">
    <div class="page" style="background:#fff" aria-label="One-pager skeleton">
      <div class="hl">Their problem, in their words.</div><div class="ln"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:70%"></div>
      <div class="cols"><div class="col k"><div class="ln"></div><div class="ln"></div><div class="ln" style="width:60%"></div><div class="ln"></div></div><div class="col p"><div class="ln"></div><div class="ln"></div><div class="ln" style="width:60%"></div><div class="ln"></div></div></div>
      <div class="first"><div class="ln"></div><div class="ln" style="width:70%"></div></div>
      <div class="foot"><span class="av"></span><div class="ln" style="flex:1"></div></div>
    </div>
    <ol class="anat">
      <li><div><b>Headline</b><span>Their problem in their words. Tungsten, all caps.</span></div></li>
      <li><div><b>What we do together</b><span>Three lines, no more.</span></div></li>
      <li><div><b>What each side brings</b><span>Two columns: EKUZO in black, the partner in grey.</span></div></li>
      <li><div><b>A first step</b><span>The pilot shape, sized small, outlined in red. No dates or prices.</span></div></li>
      <li><div><b>Who we are</b><span>Karlin's story in two lines, the approved coach line, a contact. No kids' faces.</span></div></li>
    </ol>
  </div></section>
  <section class="band"><div class="wrap">
    <div class="op-grid">${ONEPAGERS.map(o => `<div class="op">${mini(o)}<div class="meta"><span class="prio">#${o.p}</span> <span class="h3">${esc(o.n)}</span><div class="for">${esc(o.for)}</div><ul class="clears">${o.clears.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div></div>`).join("")}</div>
  </div></section>`;
}

function viewDecisions() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("olab-dec") || "{}"); } catch (e) {}
  return `
  <section class="band black dark"><div class="wrap">
    <h2 class="h2">The pilot shape decides the most.</h2>
    <p class="subhead">Every one-pager's first step depends on it. Ticks are saved in your browser only.</p>
    <ul class="dec" style="margin-top:32px">${DECISIONS.map((d, i) => `<li class="${i === 0 ? "first" : ""}"><input type="checkbox" id="dec${i}" data-i="${i}" ${saved[i] ? "checked" : ""}><label for="dec${i}"><div class="q">${esc(d[0])}</div><div class="w">${esc(d[1])}</div></label><span class="own">${esc(d[2])}</span></li>`).join("")}</ul>
  </div></section>`;
}

/* ---------- Router ---------- */
function render(id) {
  const v = VIEWS.find(x => x.id === id) ? id : "home";
  const lane = LANES.find(l => "lane-" + l.id === v);
  const html = v === "home" ? viewHome() : v === "pathway" ? viewPathway() : v === "journey" ? viewJourney() : v === "templates" ? viewTemplates() : v === "onepagers" ? viewOnepagers() : v === "decisions" ? viewDecisions() : viewLane(lane);
  $("#main").innerHTML = `<div class="view on">${html}</div>`;
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === v ? "page" : "false"));
  $("#mnav").value = v;
  document.title = (VIEWS.find(x => x.id === v).label) + " · Outreach Lab";
  if (v === "templates") {
    renderT1();
    $("#t1-sender").onchange = renderT1; $("#t1-lane").onchange = renderT1;
    document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { const t = TEMPLATES.find(x => x.code === b.dataset.copy); copy("Subject: " + t.subj + "\n\n" + t.body); });
    if (pendingTpl) { const el = document.getElementById("tpl-" + pendingTpl); if (pendingLane) { const map = { college: "arena", schools: "school", microschools: "micro", rooms: "center", camps: "camp", creators: "creator", parents: "parent" }; if (map[pendingLane]) { $("#t1-lane").value = map[pendingLane]; renderT1(); } } if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 60); pendingTpl = null; pendingLane = null; return; }
  }
  if (v === "journey") {
    document.querySelectorAll(".chev button").forEach(b => b.onclick = () => showStage(+b.dataset.stage));
    showStage(5);
  }
  if (v === "decisions") {
    document.querySelectorAll(".dec input").forEach(c => c.onchange = () => { try { const s = JSON.parse(localStorage.getItem("olab-dec") || "{}"); s[c.dataset.i] = c.checked; localStorage.setItem("olab-dec", JSON.stringify(s)); } catch (e) {} });
  }
  window.scrollTo(0, 0);
}
let pendingTpl = null, pendingLane = null;
document.addEventListener("click", e => {
  const a = e.target.closest("[data-tpl]");
  if (a) { pendingTpl = a.dataset.tpl; pendingLane = a.dataset.lane || null; if (location.hash === "#templates") { e.preventDefault(); render("templates"); } }
});

/* Nav */
(function buildNav() {
  let h = "", g = "", o = "";
  VIEWS.forEach(v => {
    if (v.group !== g) { g = v.group; h += `<li class="group">${g}</li>`; o += (o ? "</optgroup>" : "") + `<optgroup label="${g}">`; }
    h += `<li><a href="#${v.id}" data-v="${v.id}">${v.num ? `<span class="n">${v.num}</span>` : ""}${esc(v.label)}</a></li>`;
    o += `<option value="${v.id}">${v.num ? v.num + ". " : ""}${esc(v.label)}</option>`;
  });
  $("#nav").innerHTML = h;
  $("#mnav").innerHTML = o + "</optgroup>";
  $("#mnav").onchange = e => { location.hash = e.target.value; };
})();
window.addEventListener("hashchange", () => render(location.hash.slice(1)));
render(location.hash.slice(1));
</script>
</body>
</html>
